version: 2

updates:
  # Actions are pinned by major tag (`@v4`) and that tag does not move on its
  # own: without this, checkout and setup-node stay on the version of the day the
  # workflow was written. It is the most forgotten ecosystem and the cheapest to
  # review.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    # Ungrouped, any given Monday is ten PRs nobody reviews. Minor and patch go
    # together by dependency type; majors still arrive on their own, which is
    # when the changelog really has to be read.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5
