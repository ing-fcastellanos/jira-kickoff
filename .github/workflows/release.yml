name: Release

# A `v*` tag is the only thing that publishes. The version lives in package.json
# and the tag only confirms it: if they disagree, the job stops before touching
# the registry.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release
      id-token: write # npm provenance
    environment:
      name: npm
      url: https://www.npmjs.com/package/jira-kickoff
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check that the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(npm pkg get version | tr -d '"')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi

      # A tag with a hyphen (v1.2.0-beta.1) goes out as a prerelease and under the
      # `next` dist-tag, so that a plain `npx jira-kickoff` never picks it up.
      - name: Resolve the channel
        id: channel
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          fi

      # `prepublishOnly` runs typecheck, tests and build: nothing is published
      # without passing them.
      - name: Publish to npm
        run: npm publish --provenance --access public --tag ${{ steps.channel.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ${{ steps.channel.outputs.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
